<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0f0e" />
    <title>Get Rewards</title>
    <style>
      html, body, #app {
        margin: 0; min-height: 100%;
        background: #0c0f0e; color: #f5f7f6;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .boot-loading {
        min-height: 100vh;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 1.1rem;
        background:
          radial-gradient(ellipse 60% 40% at 50% 0%, rgba(45,212,191,0.18), transparent 55%),
          #0c0f0e;
      }
      .boot-ring {
        width: 4rem; height: 4rem; border-radius: 50%;
        border: 3px solid rgba(45,212,191,0.2);
        border-top-color: #2dd4bf;
        border-right-color: #fbbf24;
        animation: spin 0.9s linear infinite;
        display: grid; place-items: center;
      }
      .boot-ring span { font-size: 1.4rem; animation: spin 0.9s linear infinite reverse; }
      .boot-text { color: #5eead4; font-size: 1rem; font-weight: 700; letter-spacing: 0.04em; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      try {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.ready) {
          window.Telegram.WebApp.ready()
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot-loading">
        <div class="boot-ring"><span>💸</span></div>
        <div class="boot-text">GET REWARDS</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
