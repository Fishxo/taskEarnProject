<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b18" />
    <title>Get Rewards</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        min-height: 100%;
        background: #070b18;
        color: #f4f6ff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .boot-loading {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background:
          radial-gradient(ellipse 80% 50% at 50% -15%, rgba(109, 124, 255, 0.22), transparent 60%),
          #070b18;
      }
      .boot-logo {
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 18px;
        background: linear-gradient(160deg, #9b8cff, #5a6ef5);
        display: grid;
        place-items: center;
        font-size: 1.5rem;
        box-shadow: 0 12px 32px rgba(79, 107, 255, 0.35);
      }
      .boot-text {
        color: #b7c0ff;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .boot-spinner {
        width: 1.4rem;
        height: 1.4rem;
        border: 2px solid rgba(183, 192, 255, 0.25);
        border-top-color: #9aa8ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      try {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.ready) {
          window.Telegram.WebApp.ready()
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot-loading">
        <div class="boot-logo">💰</div>
        <div class="boot-text">Get Rewards</div>
        <div class="boot-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
