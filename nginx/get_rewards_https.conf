# Production nginx with Let's Encrypt (sslip.io or your domain)
# Install: sudo cp nginx/get_rewards_https.conf /etc/nginx/sites-available/get_rewards
# Replace YOUR-HOST.sslip.io and YOUR_EC2_IP before enabling.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR-HOST.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_EC2_IP;
    return 301 https://YOUR-HOST.sslip.io$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name YOUR-HOST.sslip.io;

    ssl_certificate /etc/letsencrypt/live/YOUR-HOST.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR-HOST.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/get_rewards_access.log;
    error_log /var/log/nginx/get_rewards_error.log;
    client_max_body_size 10M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
